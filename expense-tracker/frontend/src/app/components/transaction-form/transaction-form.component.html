<div class="form-container">
  <h2>Add Transaction</h2>
  <div class="form">
    <div class="form-group">
      <label>Title *</label>
      <input type="text" [(ngModel)]="transaction.title" placeholder="e.g. Monthly Rent" required>
    </div>
    <div class="form-group">
      <label>Amount *</label>
      <input type="number" [(ngModel)]="transaction.amount" placeholder="0.00" required>
    </div>
    <div class="form-group">
      <label>Type *</label>
      <select [(ngModel)]="transaction.type">
        <option value="INCOME">Income</option>
        <option value="EXPENSE">Expense</option>
      </select>
    </div>
    <div class="form-group">
      <label>Category *</label>
      <select [(ngModel)]="transaction.category">
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date *</label>
      <input type="date" [(ngModel)]="transaction.date" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="transaction.description" placeholder="Optional notes..."></textarea>
    </div>
    <div class="form-actions">
      <button (click)="submit()" class="btn-save">Save Transaction</button>
      <a routerLink="/transactions" class="btn-cancel">Cancel</a>
    </div>
  </div>
</div>
